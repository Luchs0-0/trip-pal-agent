<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripPal · 两地行程助手</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#2a3442;
    --txt:#e6edf3; --sub:#9aa7b4; --dim:#6b7887;
    --acc1:#38bdf8; --green:#34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column;}
  header{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  header h1{font-size:18px; background:linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  header span{color:var(--dim); font-size:12px;}
  #messages{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:75%; padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,#1e3a5f,#243b6b); border:1px solid #2c4a7c;}
  .msg.bot{align-self:flex-start; background:var(--panel); border:1px solid var(--line);}
  .msg.err{align-self:flex-start; background:#3a1d1d; border:1px solid #6b2a2a; color:#f8a5a5;}
  .trace{font-size:12px; color:var(--dim); margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .trace .step{color:var(--acc1);}
  .trace .res{color:var(--green);}
  #inputbar{display:flex; gap:10px; padding:14px 24px; border-top:1px solid var(--line);}
  #input{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 16px; font-size:14px; outline:none;}
  #input:focus{border-color:var(--acc1);}
  #send{background:linear-gradient(135deg,#38bdf8,#818cf8); border:none; color:#0f1216; font-weight:700; padding:12px 22px; border-radius:10px; cursor:pointer; font-size:14px;}
  #send:hover{opacity:.9;}
  #send:disabled{opacity:.5; cursor:not-allowed;}
  #clear{background:var(--panel); border:1px solid var(--line); color:var(--dim); font-weight:700; padding:12px 22px; border-radius:10px; cursor:pointer; font-size:14px;}
  #
  .hint{color:var(--dim); font-size:12px; padding:0 24px 10px;}
</style>
</head>
<body>

<header>
  <h1>TripPal</h1>
  <span>香港 / 内地 行程与节假日助手</span>
</header>

<div id="messages">
  <div class="msg bot">你好！我是 TripPal 👋 可以问我：
- "2026 年国庆内地放几天假？"
- "香港 2027 年春节是哪几天？"
- "内地和香港下个共同长假期是什么时候？"</div>
</div>

<div class="hint">提示：回答下方会显示 Agent 的工具调用过程，方便你理解它是怎么思考的。</div>

<div id="inputbar">
  <input id="input" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off">
  <button id="send">发送</button>
  <button id="clear">清空</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const clearBtn = document.getElementById('clear');

// 添加一条消息到界面
function addMessage(role, content, trace) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = content;

  // 如果带工具轨迹，展示出来
  if (trace && trace.length) {
    const t = document.createElement('div');
    t.className = 'trace';
    t.textContent = '🧠 工具调用过程：';
    trace.forEach((step, i) => {
      const s = document.createElement('div');
      const args = Object.entries(step.args || {})
        .map(([k, v]) => `${k}=${v}`).join(', ');
      s.innerHTML = `&nbsp;&nbsp;${i + 1}. <span class="step">${step.tool}(${args})</span>`;
      t.appendChild(s);
    });
    div.appendChild(t);
  }

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight; // 滚动到底部
  return div;
}

// 发送问题
async function sendQuestion() {
  const q = inputEl.value.trim();
  if (!q) return;
  addMessage('user', q);
  inputEl.value = '';
  sendBtn.disabled = true;
  sendBtn.textContent = '思考中…';

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    addMessage('bot', data.answer, data.trace);
  } catch (e) {
    addMessage('bot', '出错了：' + e.message, null);
    addMessage('bot', '请确认后端已启动（uvicorn web.app:app --reload --port 8000）', null);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
}
// 清空历史
function clearHistory() {
  messagesEl.innerHTML = '';
  addMessage('bot', '你好！我是 TripPal 👋 可以问我：\n- "2026 年国庆内地放几天假？"\n- "香港 2027 年春节是哪几天？"\n- "内地和香港下个共同长假期是什么时候？"', null);
}

sendBtn.addEventListener('click', sendQuestion);
clearBtn.addEventListener('click', clearHistory);

inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });
</script>
</body>
</html>

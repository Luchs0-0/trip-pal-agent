<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripPal · 两地行程助手</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#2a3442;
    --txt:#e6edf3; --sub:#9aa7b4; --dim:#6b7887;
    --acc1:#38bdf8; --green:#34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; height:100vh; display:flex; flex-direction:column;}
  header{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;}
  header h1{font-size:18px; background:linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  header span{color:var(--dim); font-size:12px;}
  #messages{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:75%; padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,#1e3a5f,#243b6b); border:1px solid #2c4a7c;}
  .msg.bot{align-self:flex-start; background:var(--panel); border:1px solid var(--line);}
  .msg.err{align-self:flex-start; background:#3a1d1d; border:1px solid #6b2a2a; color:#f8a5a5;}
  .trace{font-size:12px; color:var(--dim); margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .trace .step{color:var(--acc1);}
  .trace .res{color:var(--green);}
  #inputbar{display:flex; gap:10px; padding:14px 24px; border-top:1px solid var(--line);}
  #input{flex:1; background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:12px 16px; font-size:14px; outline:none;}
  #input:focus{border-color:var(--acc1);}
  #send{background:linear-gradient(135deg,#38bdf8,#818cf8); border:none; color:#0f1216; font-weight:700; padding:12px 22px; border-radius:10px; cursor:pointer; font-size:14px;}
  #send:hover{opacity:.9;}
  #send:disabled{opacity:.5; cursor:not-allowed;}
  #clear{background:var(--panel); border:1px solid var(--line); color:var(--dim); font-weight:700; padding:12px 22px; border-radius:10px; cursor:pointer; font-size:14px;}
  #clear:hover{opacity:.9;}
  .hint{color:var(--dim); font-size:12px; padding:0 24px 10px;}
</style>
</head>
<body>

<header>
  <h1>TripPal</h1>
  <span>香港 / 内地 行程与节假日助手</span>
</header>

<div id="messages">
  <!-- 欢迎语由 JS 的 showWelcome() 渲染（含快捷提问按钮）-->
</div>

<div class="hint">提示：回答下方会显示 Agent 的工具调用过程，方便你理解它是怎么思考的。</div>

<div id="inputbar">
  <input id="input" type="text" placeholder="输入你的问题，回车发送…" autocomplete="off">
  <button id="send">发送</button>
  <button id="clear">清空</button>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');
const clearBtn = document.getElementById('clear');

// 添加一条消息到界面
function addMessage(role, content, trace) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');

  // 内容区独立成 .content 子元素：流式更新时可以单独改它
  const contentEl = document.createElement('div');
  contentEl.className = 'content';
  contentEl.textContent = content;
  div.appendChild(contentEl);

  // 工具轨迹容器：始终创建（流式时往里实时填，历史加载时填已有内容）
  const traceEl = document.createElement('div');
  traceEl.className = 'trace';
  if (trace && trace.length) {
    traceEl.textContent = '🧠 工具调用过程：';
    trace.forEach((step, i) => {
      const s = document.createElement('div');
      const args = Object.entries(step.args || {})
        .map(([k, v]) => `${k}=${v}`).join(', ');
      s.innerHTML = `&nbsp;&nbsp;${i + 1}. <span class="step">${step.tool}(${args})</span>`;
      traceEl.appendChild(s);
    });
  }
  div.appendChild(traceEl);

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight; // 滚动到底部
  return div;
}

// 欢迎语 + 快捷提问按钮（点击按钮直接提问，省去复制粘贴）
function showWelcome() {
  const div = document.createElement('div');
  div.className = 'msg bot';

  const text = document.createElement('div');
  text.textContent = '你好！我是 TripPal 👋 可以点击下面的问题直接问我，也可以自己输入：';
  div.appendChild(text);

  // 快捷提问按钮
  const suggestions = [
    '2026 年国庆内地放几天假？',
    '香港 2027 年春节是哪几天？',
    '内地和香港下个共同长假期是什么时候？',
    '2026 国庆怎么拼假最划算？',
  ];
  const btnWrap = document.createElement('div');
  btnWrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;';
  suggestions.forEach((q) => {
    const b = document.createElement('button');
    b.textContent = q;
    b.style.cssText =
      'background:#1c2330; color:#9aa7b4; border:1px solid #2a3442; border-radius:16px; ' +
      'padding:6px 14px; font-size:12px; cursor:pointer;';
    b.addEventListener('click', () => sendQuestion(q));
    b.addEventListener('mouseenter', () => { b.style.borderColor = '#38bdf8'; b.style.color = '#38bdf8'; });
    b.addEventListener('mouseleave', () => { b.style.borderColor = '#2a3442'; b.style.color = '#9aa7b4'; });
    btnWrap.appendChild(b);
  });
  div.appendChild(btnWrap);

  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

// 会话 ID：存 localStorage，刷新页面后仍保持同一个会话（记忆不丢）
function getSessionId() {
  let sid = localStorage.getItem('trip_pal_session');
  if (!sid) {
    sid = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('trip_pal_session', sid);
  }
  return sid;
}

// 页面加载时：从后端要回该会话的历史，恢复对话界面
async function loadHistory() {
  try {
    const resp = await fetch('/history?session_id=' + encodeURIComponent(getSessionId()));
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.messages && data.messages.length) {
      // 有历史：先清掉默认欢迎语，再重新显示欢迎语 + 历史（界面保持一致）
      messagesEl.innerHTML = '';
      showWelcome();
      data.messages.forEach((m) => {
        // 历史里带 trace，恢复工具调用展示
        addMessage(m.role === 'user' ? 'user' : 'bot', m.content, m.trace || null);
      });
    } else {
      // 无历史：显示欢迎语（含快捷提问按钮）
      messagesEl.innerHTML = '';
      showWelcome();
    }
  } catch (e) {
    // 网络异常：显示欢迎语兜底
    messagesEl.innerHTML = '';
    showWelcome();
  }
}

// 页面初始化：恢复历史对话
loadHistory();

// 发送问题（支持直接传文本，供快捷按钮调用；不传则读输入框）
async function sendQuestion(questionText) {
  const q = (questionText !== undefined ? questionText : inputEl.value).trim();
  if (!q) return;
  addMessage('user', q);
  inputEl.value = '';
  sendBtn.disabled = true;
  sendBtn.textContent = '思考中…';

  // 先放一个"正在回答"的 bot 占位，流式更新它
  const botEl = addMessage('bot', '', null);
  const answerEl = botEl.querySelector('.content');
  const traceEl = botEl.querySelector('.trace');
  let traceHtml = '';
  let answerText = '';
  let lastTrace = null;

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: getSessionId(), question: q }),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);

    // 关键：用 ReadableStream 逐块读 SSE（不是一次性 resp.json()）
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      // SSE 事件以空行分隔，逐条解析
      const events = buffer.split('\n\n');
      buffer = events.pop(); // 最后一段可能不完整，留到下次

      for (const ev of events) {
        const line = ev.trim();
        if (!line.startsWith('data:')) continue;
        let data;
        try {
          data = JSON.parse(line.slice(5).trim());
        } catch (e) { continue; }

        if (data.type === 'tool_start') {
          // 实时显示"正在调用工具"（首次填充时加标题）
          if (!traceHtml) traceHtml = '🧠 工具调用过程：';
          traceHtml += `<div class="step">🔧 调用 ${data.tool}(${JSON.stringify(data.args)})…</div>`;
          if (traceEl) traceEl.innerHTML = traceHtml;
          sendBtn.textContent = '调用工具中…';
        } else if (data.type === 'tool_result') {
          const res = (data.result || '').slice(0, 200);
          traceHtml += `<div class="res">✓ ${data.tool} → ${res}</div>`;
          if (traceEl) traceEl.innerHTML = traceHtml;
        } else if (data.type === 'token') {
          // 打字机效果：逐段追加回答
          answerText += data.text;
          if (answerEl) answerEl.textContent = answerText;
          sendBtn.textContent = '回答中…';
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (data.type === 'done') {
          answerText = data.answer || answerText;
          lastTrace = data.trace || null;
          if (answerEl) answerEl.textContent = answerText;
        }
      }
    }

    // 流结束：确保回答完整显示（tool_start/result 已实时渲染到 trace）
    if (answerEl) answerEl.textContent = answerText;
  } catch (e) {
    addMessage('bot', '出错了：' + e.message, null);
    addMessage('bot', '请确认后端已启动（uvicorn web.app:app --reload --port 8000）', null);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = '发送';
  }
}
// 清空历史：同时清界面 + 清后端记忆（调 /clear）
async function clearHistory() {
  // 1. 清后端记忆（删除该会话的持久化历史）
  try {
    await fetch('/clear?session_id=' + encodeURIComponent(getSessionId()), { method: 'POST' });
  } catch (e) {
    // 网络异常不阻塞界面清空
  }
  // 2. 清界面，恢复欢迎语（含快捷提问按钮）
  messagesEl.innerHTML = '';
  showWelcome();
}

sendBtn.addEventListener('click', sendQuestion);
clearBtn.addEventListener('click', clearHistory);

inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendQuestion(); });
</script>
</body>
</html>

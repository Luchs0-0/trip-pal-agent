# 部署在线演示版（demo.html）到 GitHub Pages
# 每次 push 到 main 时自动更新，零成本、不消耗任何 API 额度
name: Deploy Demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只跑一次部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 只发布 web/static 目录（demo.html 和真实前端都在这里）
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/static

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

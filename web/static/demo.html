<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TripPal · 两地行程助手（在线演示）</title>
<style>
  :root{
    --bg:#0f1216; --panel:#161b22; --line:#2a3442;
    --txt:#e6edf3; --sub:#9aa7b4; --dim:#6b7887;
    --acc1:#38bdf8; --green:#34d399;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  body{background:var(--bg); color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; display:flex; flex-direction:column;}
  header{padding:18px 24px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
  header h1{font-size:18px; background:linear-gradient(90deg,#38bdf8,#818cf8); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  header span{color:var(--dim); font-size:12px;}
  .demo-badge{background:#3a2d1d; color:#fbbf24; border:1px solid #6b4a1d; font-size:11px; padding:3px 10px; border-radius:12px; font-weight:600;}
  .demo-badge a{color:#fbbf24;}
  #messages{flex:1; overflow-y:auto; padding:20px 24px; display:flex; flex-direction:column; gap:14px;}
  .msg{max-width:78%; padding:12px 16px; border-radius:12px; font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,#1e3a5f,#243b6b); border:1px solid #2c4a7c;}
  .msg.bot{align-self:flex-start; background:var(--panel); border:1px solid var(--line);}
  .trace{font-size:12px; color:var(--dim); margin-top:10px; border-top:1px dashed var(--line); padding-top:8px;}
  .trace .step{color:var(--acc1);}
  .suggest{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .suggest button{background:#1c2330; color:#9aa7b4; border:1px solid #2a3442; border-radius:16px; padding:6px 14px; font-size:12px; cursor:pointer;}
  .suggest button:hover{border-color:var(--acc1); color:var(--acc1);}
  .footer{padding:12px 24px; border-top:1px solid var(--line); color:var(--dim); font-size:12px; text-align:center;}
  .footer a{color:var(--acc1);}
  .typing{color:var(--dim); font-style:italic;}
  table{width:100%; border-collapse:collapse; margin:8px 0; font-size:13px;}
  th,td{text-align:left; padding:6px 10px; border-bottom:1px solid var(--line);}
  th{color:var(--acc1);}
</style>
</head>
<body>

<header>
  <h1>TripPal</h1>
  <span>香港 / 内地 行程与节假日助手</span>
  <span class="demo-badge">🎬 在线演示模式 · <a href="https://github.com/zhounongshen/trip-pal-agent" target="_blank">完整功能请本地运行（源码）</a></span>
</header>

<div id="messages"></div>

<div class="footer">
  📌 演示版使用预录回答，不消耗任何 API 额度 · 真实 Agent 由 LangGraph + DeepSeek V4 Flash 驱动，支持多轮记忆与拼假计算
</div>

<script>
const messagesEl = document.getElementById('messages');

// ---------- 预录演示数据：每个快捷问题对应的完整回答 + 工具轨迹 ----------
const DEMOS = {
  '2026 年国庆内地放几天假？': {
    trace: [
      { tool: 'get_holidays_cn', args: 'year=2026, month=10' },
    ],
    answer: '2026 年内地国庆节放假 **7 天**：\n\n📅 **10月1日（周四）～10月7日（周三）**\n- 调休上班：9月20日（周日）、10月10日（周六）\n\n需要我帮你看看香港同期假期，或者规划拼假吗？',
  },
  '香港 2027 年春节是哪几天？': {
    trace: [
      { tool: 'get_holidays_hk', args: 'year=2027, month=2' },
    ],
    answer: '🇭🇰 香港 2027 年农历新年公众假期：\n\n| 日期 | 星期 | 节日 |\n|---|---|---|\n| 2月6日 | 星期六 | 農曆年初一 |\n| 2月8日 | 星期一 | 農曆年初三 |\n| 2月9日 | 星期二 | 農曆年初四 |\n\n（年初二 2月7日恰逢周日）\n\n内地 2027 年安排尚未发布，届时两地可对比。',
  },
  '内地和香港下个共同长假期是什么时候？': {
    trace: [
      { tool: 'find_common_breaks', args: 'year=2026' },
    ],
    answer: '🤝 2026 年两地共同假期窗口（内地 ≥3 天且与香港有重叠）：\n\n- **春节**：内地 2/15～2/23，香港 2/17～2/19 在窗口内\n- **劳动节**：内地 5/1～5/5，香港 5/1 劳动节重叠\n- **国庆节**：内地 10/1～10/7，香港 10/1 国庆日重叠\n\n最长的共同窗口是**春节**，适合两地家庭团聚或跨境出行。',
  },
  '2026 国庆怎么拼假最划算？': {
    trace: [
      { tool: 'suggest_leave_stacking', args: 'year=2026, festival=国庆节, region=cn, max_leave_days=5' },
    ],
    answer: '✂️ 2026 国庆拼假方案（请 2 天最划算）：\n\n**方案一：请 2 天 → 休 10 天 ⭐**\n- 请假：10月8日（周四）、10月9日（周五）\n- 连休：10月1日～10月11日（10天，周末自动接上）\n- 注意：10月10日（周六）调休上班\n\n**方案二：请 3 天 → 休 13 天 🚀**\n- 请假：9月28日～9月30日\n- 连休：9月25日～10月7日（中秋+国庆连休！）\n\n用 2 天年假换 10 天长假，性价比天花板 🎉',
  },
};

// 把 Markdown 风格的回答渲染成 HTML（支持 **加粗**、表格）
function renderAnswer(text) {
  let html = text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')   // **粗体**
    .replace(/\n/g, '<br>');
  // 简单表格渲染
  if (text.includes('|---|')) {
    const rows = text.split('\n').filter(l => l.includes('|'));
    let table = '<table><thead><tr>';
    const headCells = rows[0].split('|').filter(c => c.trim());
    table += headCells.map(c => `<th>${c.trim()}</th>`).join('');
    table += '</tr></thead><tbody>';
    for (let i = 2; i < rows.length; i++) {
      const cells = rows[i].split('|').filter(c => c.trim());
      table += '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
    }
    table += '</tbody></table>';
    html = text
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
    // 把表格行替换为 table（简单处理：只替换完整表格块）
    const tableBlock = rows.join('\n');
    html = html.replace(tableBlock, table);
  }
  return html;
}

function addMessage(role, content, trace, isHtml) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (isHtml) div.innerHTML = content;
  else div.textContent = content;

  if (trace && trace.length) {
    const t = document.createElement('div');
    t.className = 'trace';
    t.textContent = '🧠 工具调用过程：';
    trace.forEach((step, i) => {
      const s = document.createElement('div');
      s.innerHTML = `&nbsp;&nbsp;${i + 1}. <span class="step">${step.tool}(${step.args})</span>`;
      t.appendChild(s);
    });
    div.appendChild(t);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

// 欢迎语 + 快捷提问按钮
function showWelcome() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  const text = document.createElement('div');
  text.textContent = '你好！我是 TripPal 👋 这是在线演示版。点击下面的问题，观看预录的 Agent 回答（含工具调用过程）：';
  div.appendChild(text);
  const wrap = document.createElement('div');
  wrap.className = 'suggest';
  Object.keys(DEMOS).forEach(q => {
    const b = document.createElement('button');
    b.textContent = q;
    b.addEventListener('click', () => playDemo(q));
    wrap.appendChild(b);
  });
  div.appendChild(wrap);
  messagesEl.appendChild(div);
}

// 播放演示：用户问题 → "思考中" → 预录回答 + 工具轨迹
function playDemo(q) {
  addMessage('user', q);
  const thinking = addMessage('bot', '⏳ Agent 思考中（演示模式：即时播放预录回答）...', null);
  thinking.classList.add('typing');

  setTimeout(() => {
    thinking.remove();
    const demo = DEMOS[q];
    addMessage('bot', renderAnswer(demo.answer), demo.trace, true);
  }, 600);
}

// 初始化
showWelcome();
</script>
</body>
</html>
